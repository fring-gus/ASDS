{% extends "base.html" %}
{% block title %}Login &mdash; ASDS{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Welcome Back</h2>
    <p style="text-align:center; color:var(--text-muted); margin-bottom:1.5rem; margin-top:-1rem;">Sign in to continue</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="role">Login as</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
            </select>
        </div>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
